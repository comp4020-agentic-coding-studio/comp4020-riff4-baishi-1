<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Drift</title>
    <meta
      name="description"
      content="Drift: a browser instrument you play by touch, click or keyboard — eight pentatonic pads, no wrong notes."
    />

    <!--
      The link-preview card: public/card.png, 1200x630 --- replace it. The URL
      resolves against this page, like any link. No og:title/og:description:
      scrapers fall back to the <title> and description above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <button type="button" id="fart" class="fart-btn">Home</button>
      </nav>
    </header>
    <main>
      <h1>Drift</h1>
      <p id="hint" class="hint">Touch, click, or press a key to play. Nothing here can go wrong.</p>
      <canvas id="waveform" class="waveform" aria-hidden="true"></canvas>
      <div class="instrument" id="instrument" role="group" aria-label="Eight-note pentatonic instrument">
        <button class="pad" type="button" data-freq="65.41" data-key="a" aria-label="Play C2">
          <span class="keycap" aria-hidden="true">A</span>
        </button>
        <button class="pad" type="button" data-freq="73.42" data-key="s" aria-label="Play D2">
          <span class="keycap" aria-hidden="true">S</span>
        </button>
        <button class="pad" type="button" data-freq="82.41" data-key="d" aria-label="Play E2">
          <span class="keycap" aria-hidden="true">D</span>
        </button>
        <button class="pad" type="button" data-freq="98.00" data-key="f" aria-label="Play G2">
          <span class="keycap" aria-hidden="true">F</span>
        </button>
        <button class="pad" type="button" data-freq="110.00" data-key="g" aria-label="Play A2">
          <span class="keycap" aria-hidden="true">G</span>
        </button>
        <button class="pad" type="button" data-freq="130.81" data-key="h" aria-label="Play C3">
          <span class="keycap" aria-hidden="true">H</span>
        </button>
        <button class="pad" type="button" data-freq="146.83" data-key="j" aria-label="Play D3">
          <span class="keycap" aria-hidden="true">J</span>
        </button>
        <button class="pad" type="button" data-freq="164.81" data-key="k" aria-label="Play E3">
          <span class="keycap" aria-hidden="true">K</span>
        </button>
      </div>
      <p class="note">
        Slide across pads to bend between notes. Move up and down to brighten or darken the sound.
      </p>
    </main>
    <section class="pitch-control">
      <div class="bbs-titlebar">FREQUENCY CONTROL v1.0 -=- SYSOP: DRIFT</div>
      <div class="bbs-body">
        <label for="pitch">FREQ&gt;</label>
        <input type="range" id="pitch" min="0.1" max="4" step="0.01" value="1"
          aria-label="Frequency: scales every pad up or down together" />
        <span class="bbs-readout" id="pitch-readout">100%<span class="bbs-cursor" aria-hidden="true">_</span></span>
      </div>
      <div class="bbs-body">
        <label for="reverb">RVRB&gt;</label>
        <input type="range" id="reverb" min="0" max="1" step="0.01" value="0.22"
          aria-label="Reverb amount" />
        <span class="bbs-readout" id="reverb-readout">22%</span>
      </div>
      <div class="bbs-body bbs-toggles">
        <label><input type="checkbox" id="sticky" /> STICKY KEYS</label>
        <label><input type="checkbox" id="invert" /> INVERT</label>
      </div>
    </section>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
